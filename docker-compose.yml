services:
  lassy:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lassy
    env_file:
      - .env
    environment:
      HF_HOME: /app/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "${API_PORT:-8082}:8000"
    volumes:
      - ${MODEL_CACHE_DIR:-./.cache/huggingface}:/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway" # Enable host.docker.internal on Linux
    command: uvicorn lassy.api:app --host 0.0.0.0 --port 8000 --log-level critical

