[project]
name = "lassy"
version = "0.2.0"
description = "Local document indexing and retrieval over MCP and optional HTTP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.31,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "sentence-transformers>=6.1,<7",
    "torch==2.14.1",
    "transformers>=5.10,<6",
    "huggingface-hub>=1,<2",
    "mcp>=1.30,<2",
    "starlette>=1.3.1,<2",
]

[project.scripts]
lassy-mcp = "lassy.mcp:main"
lassy-api = "lassy.api:main"
lassy-models = "lassy.models:main"

[project.optional-dependencies]
api = ["fastapi>=0.135,<1", "uvicorn>=0.41,<1"]
dev = ["pytest>=8,<10", "ruff>=0.17.4", "pip-audit>=2.9,<3", "build>=1.3,<2"]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lassy*"]

[tool.setuptools.package-data]
lassy = ["schema.sql"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
