[project]
name = "lassy"
version = "0.1.0"
description = "Shared document ingestion and retrieval service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "asyncpg==0.30.0",
    "numpy==2.1.3",
    "sentence-transformers==3.3.1",
    "torch==2.6.0",
    "transformers==4.47.1",
    "huggingface-hub==0.26.5",
    "httpx==0.28.1",
    "aiohttp==3.11.11",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "python-dotenv==1.0.1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
